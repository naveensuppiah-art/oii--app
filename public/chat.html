<!DOCTYPE html>

<html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Oii Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:black;
font-family:sans-serif;
overflow:hidden;

}

#topBar{

height:60px;

background:#111;

color:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 20px;

border-bottom:
1px solid #333;

}

#status{

color:hotpink;
font-weight:bold;

}

#messages{

height:calc(100vh - 130px);

overflow-y:auto;

padding:15px;

display:flex;

flex-direction:column;

gap:10px;

}

.msg{

padding:12px 15px;

border-radius:15px;

max-width:70%;

word-wrap:break-word;

color:white;

font-size:15px;

}

.me{

background:hotpink;

align-self:flex-end;

}

.other{

background:#222;

align-self:flex-start;

}

#bottom{

position:fixed;

bottom:10px;

left:0;

width:100%;

display:flex;

align-items:center;

gap:10px;

padding:0 10px;

}

#msgInput{

flex:1;

height:50px;

border:none;

border-radius:25px;

padding:0 15px;

font-size:16px;

outline:none;

}

#sendBtn{

width:75px;

height:50px;

border:none;

border-radius:25px;

background:hotpink;

color:white;

font-weight:bold;

font-size:15px;

}

</style>

</head>

<body>

<div id="topBar">

<h3>Oii Chat 😄</h3>

<div id="status">
Online
</div>

</div>

<div id="messages"></div>

<div id="bottom">

<input
id="msgInput"
placeholder="Type message...">

<button id="sendBtn">
Send
</button>

</div>

<script type="module">

import {
initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
onChildAdded
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// FIREBASE CONFIG

const firebaseConfig = {

  apiKey: "AIzaSyBSPst1YvKZHuAH082jOr8iOFHtp5yqXms",

  authDomain:
  "oii-f5297.firebaseapp.com",

  databaseURL:
  "https://oii-f5297-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
  "oii-f5297",

  storageBucket:
  "oii-f5297.firebasestorage.app",

  messagingSenderId:
  "390917741842",

  appId:
  "1:390917741842:web:a557fd4165660b652ce7cb",

  measurementId:
  "G-WXYLV585M2"

};


// INIT FIREBASE

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);


// ELEMENTS

const messages =
document.getElementById(
"messages"
);

const input =
document.getElementById(
"msgInput"
);

const sendBtn =
document.getElementById(
"sendBtn"
);


// USERNAME

const username =
localStorage.getItem(
"username"
) || "User";


// SEND MESSAGE

sendBtn.onclick = () => {

if(!input.value) return;

push(
ref(db,"chat"),
{

user:username,

msg:input.value

});

input.value = "";

};


// ENTER KEY SEND

input.addEventListener(
"keypress",
(e)=>{

if(e.key === "Enter"){

sendBtn.click();

}

});


// RECEIVE MESSAGE

onChildAdded(
ref(db,"chat"),
(snapshot)=>{

const data =
snapshot.val();

const div =
document.createElement(
"div"
);

div.classList.add(
"msg"
);

if(
data.user === username
){

div.classList.add(
"me"
);

}else{

div.classList.add(
"other"
);

}

div.innerHTML =
"<b>" +
data.user +
"</b><br>" +
data.msg;

messages.appendChild(
div
);

messages.scrollTop =
messages.scrollHeight;

});

</script>

</body>

</html>
