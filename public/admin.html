<!DOCTYPE html>

<html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<style>

body{

margin:0;
background:black;
font-family:sans-serif;
color:white;

}

#top{

padding:20px;

font-size:28px;

font-weight:bold;

text-align:center;

background:#111;

}

#stats{

display:flex;

justify-content:space-around;

padding:20px;

}

.card{

background:#111;

padding:20px;

border-radius:20px;

width:40%;

text-align:center;

}

.num{

font-size:28px;

font-weight:bold;

margin-top:10px;

}

#title{

padding:20px;

font-size:22px;

font-weight:bold;

}

#reels{

padding:15px;

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:10px;

}

.reel{

background:#111;

padding:10px;

border-radius:20px;

}

.reel video{

width:100%;

border-radius:15px;

}

.delete{

margin-top:10px;

width:100%;

height:45px;

border:none;

border-radius:15px;

background:red;

color:white;

font-size:16px;

font-weight:bold;

}

</style>

</head>

<body>

<input
id="searchUser"
placeholder="Search user..."
style="
width:90%;
height:50px;
margin:20px;
border:none;
border-radius:15px;
padding:0 15px;
font-size:16px;
">

<div id="top">
🛠️ Admin Panel
</div>

<div id="stats">

<div class="card">

Total Reels

<div class="num"
id="reelCount">
0
</div>

</div>

<div class="card">

Users

<div class="num"
id="userCount">
0
</div>

</div>

</div>

<div id="title">
Manage Reels
</div>

<div id="reels"></div>

<script>
const searchUser =
document.getElementById(
"searchUser"
);

const reelsBox =
document.getElementById(
"reels"
);

const reelCount =
document.getElementById(
"reelCount"
);

const userCount =
document.getElementById(
"userCount"
);

async function loadUsers(){

const res =
await fetch(
"/api/users/count"
);

const data =
await res.json();

userCount.innerHTML =
data.count;

}
async function loadReels(){

  reelsBox.innerHTML = "";

  const res =
  await fetch("/api/reels");

  const reels =
  await res.json();

  reelCount.innerHTML =
  reels.length;

  reels.forEach((item)=>{

    const username =
    item.username || "Unknown";
    const file =(item.video_url || "").split("/").pop();

    const reel =document.createElement("div");

    reel.className =
    "reel";

    const video =
    document.createElement("video");

    video.src =
    item.video_url;

    video.controls =
    true;

    const user =
    document.createElement("div");

    user.innerHTML =
    "👤 " + username;

    user.style.padding =
    "10px 0";

    const del =
    document.createElement("button");

    del.className =
    "delete";

    del.innerHTML =
    "Delete Reel";

   del.onclick = async () => {

  if(!confirm("Delete Reel?"))
  return;

  try {

    const res = await fetch(
      "/api/reels/" + file,
      {
        method: "DELETE"
      }
    );

    const data =
    await res.json();

    if(data.success){

      reel.remove();

      reelCount.innerHTML =
      Number(reelCount.innerHTML) - 1;

      alert("Deleted");

    } else {

      alert("Delete Failed");

    }

  } catch(err){

    console.log(err);

    alert("Server Error");

  }

};

    reel.appendChild(
      video
    );

    reel.appendChild(
      user
    );

    reel.appendChild(
      del
    );

    reelsBox.appendChild(
      reel
    );

  });

}    
searchUser.oninput = ()=>{

const value =

searchUser.value
.toLowerCase();

document
.querySelectorAll(".reel")
.forEach(reel=>{

const text =
reel.innerText
.toLowerCase();

if(text.includes(value)){

reel.style.display =
"block";

}else{

reel.style.display =
"none";

}

});
 
};
loadUsers();
loadReels();

</script>

</body>

</html>
