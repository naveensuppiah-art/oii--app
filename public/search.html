<!DOCTYPE html>

<html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Search</title>

<style>

body{

margin:0;
background:black;
font-family:sans-serif;
color:white;

}

#top{

padding:15px;

position:sticky;

top:0;

background:black;

z-index:999;

}

#search{

width:100%;

height:50px;

border:none;

border-radius:25px;

padding:0 20px;

font-size:16px;

outline:none;

box-sizing:border-box;

}

#results{

padding:15px;

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:10px;

}

.card{

background:#111;

border-radius:15px;

overflow:hidden;

}

.card video{

width:100%;

height:220px;

object-fit:cover;

}

.name{

padding:10px;

font-size:14px;

font-weight:bold;

}

</style>

</head>

<body>

<div id="top">

<input
id="search"
placeholder="Search reels...">

</div>

<div id="results"></div>

<script>

const results =
document.getElementById(
"results"
);

const search =
document.getElementById(
"search"
);


// LOAD REELS

async function load(){

const res =
await fetch("/api/reels");

const reels =
await res.json();


// TRENDING SORT

reels.sort((a,b)=>{

const aViews =

localStorage.getItem(
"views_" + (a.video || a)
) || 0;

const bViews =

localStorage.getItem(
"views_" + (b.video || b)
) || 0;

return bViews - aViews;

});


show(reels);


// SEARCH

search.oninput = ()=>{

const value =
search.value.toLowerCase();

const filtered =

reels.filter(item=>{

const text =

(item.video || item)
.toLowerCase();


// USERNAME SEARCH

if(
text.includes(value)
){
return true;
}


// HASHTAG SEARCH

if(
text.includes("#" + value)
){
return true;
}

return false;

});

show(filtered);

};

}


// SHOW REELS

function show(reels){

results.innerHTML = "";

reels.forEach(item=>{

const file =
item.video || item;

const card =
document.createElement("div");

card.className =
"card";

const video =
document.createElement("video");

video.src =
"/uploads/" + file;

video.autoplay =
true;

video.loop =
true;

video.muted =
true;

const name =
document.createElement("div");

name.className =
"name";

name.innerHTML =
file;

card.appendChild(video);

card.appendChild(name);


// OPEN REEL

card.onclick = () => {

window.location.href =
"/reels?video=" + file;

};

results.appendChild(card);

});

}


load();

</script>

</body>

</html>
