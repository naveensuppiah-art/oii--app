<!DOCTYPE html>
<html>
<head>

<title>Oii Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
background:black;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
font-family:sans-serif;
}

input{
width:250px;
padding:15px;
margin:10px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
padding:15px 40px;
font-size:18px;
border:none;
border-radius:10px;
background:#ff0080;
color:white;
margin-top:10px;
cursor:pointer;
}

#title{
font-size:40px;
margin-bottom:30px;
color:#ff0080;
}

</style>

</head>

<body>

<h1 id="title">Oii Reels 🔥</h1>

<input
type="email"
id="email"
placeholder="Enter Email">

<input
type="password"
id="password"
placeholder="Enter Password">

<button onclick="signup()">
Signup
</button>

<button onclick="login()">
Login
</button>

<script>

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

async function signup(){

const email =
emailInput.value;

const password =
passwordInput.value;

const res =
await fetch("/signup",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username:email,
email:email,
password:password

})

});

const data =
await res.json();

if(data.success){

alert("Signup Success 🔥");

}else{

alert("Signup Failed");

}

}

async function login(){

const email =
emailInput.value;

const password =
passwordInput.value;

const res =
await fetch("/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email,
password:password

})

});

const data =
await res.json();

if(data.success){

localStorage.setItem(
"username",
email
);

alert(
"Login Success 🔥"
);

window.location.href =
"/reels";

}else{

alert(
"Invalid Email or Password"
);

}

}

</script>

</body>
</html>
