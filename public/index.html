<!DOCTYPE html>
<html>
<head>
<title>Oii Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
background:black;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
font-family:Arial;
}

#title{
font-size:40px;
color:#ff0080;
margin-bottom:30px;
}

input{
width:280px;
padding:15px;
margin:10px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:310px;
padding:15px;
margin:10px;
border:none;
border-radius:10px;
background:#ff0080;
color:white;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<h1 id="title">Oii Reels 🔥</h1>

<input
type="email"
id="email"
placeholder="Enter Email">

<input
type="password"
id="password"
placeholder="Enter Password">

<button onclick="signup()">
Signup
</button>

<button onclick="login()">
Login
</button>

<script>

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

async function signup(){

const response =
await fetch("/signup",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username:emailInput.value,
email:emailInput.value,
password:passwordInput.value

})

});

const data =
await response.json();

if(data.success){

alert("Signup Success 🔥");

}else{

alert("Signup Failed");

}

}

async function login(){

const response =
await fetch("/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:emailInput.value,
password:passwordInput.value

})

});

const data =
await response.json();

if(data.success){

localStorage.setItem(
"user",
emailInput.value
);

alert("Login Success 🔥");

window.location.href =
"/reels.html";

}else{

alert("Invalid Email or Password");

}

}

</script>

</body>
</html>
